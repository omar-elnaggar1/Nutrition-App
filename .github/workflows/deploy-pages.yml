# Publishes the app (the public/ folder) to GitHub Pages every time code is pushed,
# so you can open it on your phone at https://omar-elnaggar1.github.io/Nutrition-App/
name: Publish app to GitHub Pages

on:
  push:
    branches: [claude/nutrition-tracking-app-fu2xs9]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install libraries
        run: npm ci
      - name: Check the nutrition maths
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
